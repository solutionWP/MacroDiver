; MacroDiver dongle - wireless receiver for the pad
; Board: ESP32-S3 Super Mini (ESP32-S3FH4R2, 4MB flash, native USB, RGB LED on GPIO48)
; Shares lib/macrolink (protocol + keystroke sequencer) with the pad project one level up.

[platformio]
default_envs = dongle
; Project lives on Google Drive: keep build artefacts on the local disk.
build_dir = C:/Users/odu/.pio-build/macrodiver-dongle/build
libdeps_dir = C:/Users/odu/.pio-build/macrodiver-dongle/libdeps

[env:dongle]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_extra_dirs = ../lib
monitor_speed = 115200
; TinyUSB CDC: 1200-baud touch reboots into the ROM bootloader (port number changes)
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; TinyUSB device stack -> USB HID keyboard (+ optional CDC created at runtime)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSB_MANUFACTURER='"MacroDiver"'
    -DUSB_PRODUCT='"MacroDiver Dongle"'
    ; WS2812 status LED. Some Super Mini clones have a plain LED or none: harmless.
    -DLED_PIN=48
    ; Wi-Fi regulatory country, enables channels 12-13 (pad on a home network using them)
    -DWIFI_COUNTRY='"FR"'
