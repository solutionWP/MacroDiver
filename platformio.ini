; MacroDiver - Helldivers 2 stratagem macropad
; Board: Waveshare ESP32-S3-Touch-LCD-1.46 (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM, SPD2010 412x412)

[platformio]
default_envs = macrodiver
; Project lives on Google Drive: keep build artefacts on the local disk.
build_dir = C:/Users/odu/.pio-build/macrodiver/build
libdeps_dir = C:/Users/odu/.pio-build/macrodiver/libdeps

[env:macrodiver]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = esp32s3_120_16_8-qio_opi
board_build.partitions = default_16MB.csv
; stratagem icons (generated by tools/icongen)
board_build.embed_files = data/icons.bin
monitor_speed = 115200
upload_speed = 921600
; TinyUSB CDC: 1200-baud touch reboots into the ROM bootloader (port number changes)
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

lib_deps =
    lvgl/lvgl@8.3.10
    bblanchon/ArduinoJson@7.2.1

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    ; TinyUSB device stack -> USB HID keyboard (+ optional CDC created at runtime)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DUSB_MANUFACTURER='"MacroDiver"'
    -DUSB_PRODUCT='"MacroDiver Stratagem Pad"'
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src/board
    -Wno-missing-field-initializers
